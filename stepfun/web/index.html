<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>端侧迷你知识库 · seekdb 混合检索</title>
<style>
:root{color-scheme:light dark}
body{font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;max-width:900px;margin:0 auto;padding:20px}
h1{font-size:22px;margin-bottom:2px}
.muted{color:#888;font-size:13px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;margin-right:8px}
.webgpu{background:#e6f4ea;color:#137333}
.wasm{background:#fef7e0;color:#b06000}
.err{background:#fce8e6;color:#c5221f}
.card{border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0}
input,textarea,button{font:inherit}
input[type=text]{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #ccc;border-radius:8px}
textarea{width:100%;box-sizing:border-box;min-height:90px;padding:8px 10px;border:1px solid #ccc;border-radius:8px}
button{padding:8px 16px;border-radius:8px;border:1px solid #1677ff;background:#1677ff;color:#fff;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:#fff;color:#1677ff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.progress{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:8px}
.progress>div{height:100%;background:#1677ff;width:0}
.result{border:1px solid #e5e5e5;border-radius:8px;padding:10px;margin:8px 0}
.result h4{margin:0 0 4px}
.scores{font-size:12px;color:#666}
.scores b{color:#1677ff}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid #eee;padding:4px 8px;text-align:left}
pre{background:#f6f8fa;border-radius:8px;padding:10px;overflow:auto;font-size:12px}
</style>
</head>
<body>
<h1>端侧迷你知识库</h1>
<p class="muted">导入语料 → 浏览器本地向量化 → 写入 seekdb → 向量+全文混合检索</p>
<div id="backend-badge"></div>

<div class="card">
  <div class="row">
    <label>会话：<input type="text" id="session" value="default" style="width:180px"></label>
    <span class="muted" id="model-name"></span>
  </div>
  <p class="muted">导入语料（每行一篇：标题|||正文；也支持选择 .txt/.md 文件）</p>
  <textarea id="corpus" placeholder="机器学习入门|||机器学习是人工智能的核心，包括监督学习与无监督学习"></textarea>
  <div class="row" style="margin-top:8px">
    <input type="file" id="files" multiple accept=".txt,.md">
    <button id="import-btn">导入并向量化</button>
    <button id="clear-btn" class="ghost">清空计时</button>
  </div>
  <div class="progress"><div id="prog"></div></div>
  <p class="muted" id="import-status"></p>
</div>

<div class="card">
  <input type="text" id="query" placeholder="输入查询，例如：机器学习 监督学习">
  <div class="row" style="margin-top:8px">
    <button id="search-btn">混合检索</button>
    <span class="muted" id="search-status"></span>
  </div>
  <div id="results"></div>
</div>

<div class="card">
  <h3 style="margin-top:0">计时日志（分阶段）</h3>
  <table id="timings"><thead><tr><th>阶段</th><th>耗时 ms</th><th>说明</th></tr></thead><tbody></tbody></table>
  <div class="row" style="margin-top:8px">
    <button id="export-btn" class="ghost">导出 JSON 报告</button>
  </div>
  <pre id="report"></pre>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
